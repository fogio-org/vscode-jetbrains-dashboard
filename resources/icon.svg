<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!-- Dark circle background -->
  <circle cx="250" cy="250" r="250" fill="#2B2D30"/>

  <!-- Window frame -->
  <rect x="100" y="120" width="300" height="260" rx="16" fill="none" stroke="#868A91" stroke-width="12"/>

  <!-- Vertical divider -->
  <line x1="220" y1="120" x2="220" y2="380" stroke="#868A91" stroke-width="12"/>

  <!-- Left panel: project list bars -->
  <rect x="130" y="160" width="60" height="10" rx="5" fill="#868A91"/>
  <rect x="130" y="190" width="55" height="10" rx="5" fill="#868A91"/>
  <rect x="130" y="220" width="62" height="10" rx="5" fill="#868A91"/>
  <rect x="130" y="250" width="50" height="10" rx="5" fill="#5C5F65"/>
  <rect x="130" y="280" width="58" height="10" rx="5" fill="#5C5F65"/>
  <rect x="130" y="310" width="45" height="10" rx="5" fill="#5C5F65"/>
  <rect x="130" y="340" width="52" height="10" rx="5" fill="#5C5F65"/>

  <!-- Right panel: action cards -->
  <rect x="248" y="150" width="124" height="58" rx="10" fill="#393B40"/>
  <rect x="248" y="222" width="124" height="58" rx="10" fill="#3574F0"/>
  <rect x="248" y="294" width="124" height="58" rx="10" fill="#393B40"/>
</svg>
